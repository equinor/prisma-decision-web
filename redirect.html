<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const useDarkMode = localStorage.getItem('useDarkMode') === 'true';
      document.documentElement.classList.toggle('dark', useDarkMode);
    </script>
    <style>
      :root {
        color-scheme: light;
        --background: #f7f7f7;
        --text: #3d3d3d;
        --muted: #6f6f6f;
        --accent: #007079;
        --accent-soft: #d9eeee;
      }

      :root.dark {
        color-scheme: dark;
        --background: rgb(19, 38, 52);
        --text: #ffffff;
        --muted: #9ca6ac;
        --accent: #97cace;
        --accent-soft: #263f4e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--background);
        color: var(--text);
        font-family: 'Avenir Next', Avenir, sans-serif;
        height: 100vh
      }

      main {
        display: flex;
        width: min(100%, 360px);
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        filter: drop-shadow(0 8px 14px rgba(0, 49, 61, 0.16));
      }

      .product-name {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .message {
        margin: 12px 0 28px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--accent-soft);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 1800ms;
        }
      }
    </style>
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signing in - Prisma</title>
  </head>
  <body>
    <main role="status" aria-live="polite">
          <img class="logo" src="/icon.png" alt="" />
          <p class="product-name">Prisma</p>
          <h1>Signing you in</h1>
          <p class="message">Connecting securely to your workspace.</p>
          <div class="spinner" aria-hidden="true"></div>
    </main>
    <script type="module">
      import { broadcastResponseToMainFrame } from '@azure/msal-browser/redirect-bridge';

      broadcastResponseToMainFrame().catch(error => {
        console.error('Error broadcasting authentication response:', error);
      });
    </script>
  </body>
</html>
