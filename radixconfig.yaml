apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
    name: prisma-decision-web-public

spec:
    environments:
        - name: public
          build:
            from: PUBLIC
    components:
        - name: frontend
          src: .
          publicPort: http
          ports:
              - name: http
                port: 3000
    dnsAlias:
        - alias: prisma
          environment: public
          component: frontend
        