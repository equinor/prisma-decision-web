name: Bug report
description: Report a problem with Prisma Decision Web
title: "[Bug]: "
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Which environment did the problem occur in?
      placeholder: For example, development, test, or production
    validations:
      required: true

  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: Provide a link to the page where the problem occurred.
      placeholder: https://example.com/page
    validations:
      required: true

  - type: checkboxes
    id: developer-access
    attributes:
      label: Developer access
      options:
        - label: I have given one of the developers access to the affected project.
          required: true

  - type: textarea
    id: problem-description
    attributes:
      label: Problem description
      description: Describe the problem and what you expected to happen.
      placeholder: Tell us what happened, what you expected, and how to reproduce it.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe how you think the problem could be solved.
    validations:
      required: true
